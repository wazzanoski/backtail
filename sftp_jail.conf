AllowAgentForwarding no
AllowStreamLocalForwarding no
AllowTcpForwarding no
# Only allow the 'backtail' user to connect
AllowUsers backtail
# Set publickey as the only AuthenticationMethod
AuthenticationMethods publickey
# Specify path to authorized_keys (absolute path, interpreted before chroot)
AuthorizedKeysFile /data/backtail/.ssh/authorized_keys
Banner /config/banner.txt
# Jail users to '/data' directory
ChrootDirectory /data
# Make '/data/backtail' the landing directory
ForceCommand internal-sftp -d /backtail
# Specify path to the SSH host key for server authentication
HostKey /etc/ssh/ssh_host_ed25519_key
# Only accept ED25519 host key algorithm for strict security
HostKeyAlgorithms ssh-ed25519
PermitRootLogin no
# Only accept ED25519 public key algorithm for user authentication
PubkeyAcceptedAlgorithms ssh-ed25519
PubkeyAuthentication yes
# Due to how Unraid manages file permissions,
# don't check file modes and ownership for login
StrictModes no
Subsystem sftp internal-sftp
X11Forwarding no

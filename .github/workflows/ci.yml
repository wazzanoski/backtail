name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Lint Shell Scripts
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: "-x" # Fix SC1091 errors

      # Lint Dockerfile
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3007,DL3018 # Use latest versions, don't pin specific versions

      # Lint GitHub Actions workflows
      - name: Run actionlint
        uses: raven-actions/actionlint@v2.2.0

      # Lint SSHD Configuration
      - name: Test SSHD Syntax
        run: |
          # 1. Create the missing privilege directory that OpenSSH expects
          sudo mkdir -p /run/sshd
          # 2. Safely run your configuration validation
          sudo sshd -t -f ./sftp_jail.conf

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t backtail:test .
      
      - name: Setup test helper
        run: |
          chmod +x ./test_helper.sh
          cp ./test_helper.sh /tmp/test_helper.sh
      
      - name: Test dry-run mode
        run: |
          docker run --rm -e DRY_RUN=true \
            backtail:test || exit 1

      - name: Test invalid PUID=abc (should fail)
        run: |
          ! docker run --rm -e PUID=abc -e DRY_RUN=true backtail:test

      - name: Test invalid PUID=0 - "root" (should fail)
        run: |
          ! docker run --rm -e PUID=0 -e DRY_RUN=true backtail:test

      - name: Test invalid PUID=999 - in system user range (should fail)
        run: |
          ! docker run --rm -e PUID=999 -e DRY_RUN=true backtail:test

      - name: Test invalid PGID=abc (should fail)
        run: |
          ! docker run --rm -e PGID=abc -e DRY_RUN=true backtail:test

      - name: Test invalid PGID=0 - "root" (should fail)
        run: |
          ! docker run --rm -e PGID=0 -e DRY_RUN=true backtail:test

      - name: Test invalid PGID=999 - in system user range (should fail)
        run: |
          ! docker run --rm -e PGID=999 -e DRY_RUN=true backtail:test

      - name: Test invalid UMASK=abc (should fail)
        run: |
          ! docker run --rm -e UMASK=abc -e DRY_RUN=true backtail:test
      
      - name: Test invalid UMASK=888 (should fail)
        run: |
          ! docker run --rm -e UMASK=888 -e DRY_RUN=true backtail:test

      - name: Test valid PUID/PGID/UMASK combinations
        run: |
          # Test system user range (PUID=99, PGID=100)
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=022 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=002 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=000 -e DRY_RUN=true backtail:test || exit 1
          # Test regular user range (PUID>=1000, PGID>=1000)
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=002 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=000 -e DRY_RUN=true backtail:test || exit 1

      - name: Test SSH host key generation
        run: |
          source /tmp/test_helper.sh
          test -f "${SFTP_TEST_CONFIG_DIR}/ssh_host_ed25519_key" || exit 1

      - name: Test banner file creation
        run: |
          source /tmp/test_helper.sh
          test -f "$SFTP_TEST_CONFIG_DIR/banner.txt" || exit 1
      
      - name: Test user permissions
        run: |
          docker run --rm -e PUID=1000 -e DRY_RUN=true \
            backtail:test sh -c "id -u | grep -q 1000" || exit 1
      
      - name: Test group permissions
        run: |
          docker run --rm -e PUID=1000 -e DRY_RUN=true \
            backtail:test sh -c "id -g | grep -q 1000" || exit 1
      
      - name: Test UMASK application
        run: |
          docker run --rm -e UMASK=022 -e DRY_RUN=true \
            backtail:test sh -c "umask | grep -q 022" || exit 1
          docker run --rm -e UMASK=002 -e DRY_RUN=true \
            backtail:test sh -c "umask | grep -q 002" || exit 1

      - name: Test SSH config permissions
        run: |
          source /tmp/test_helper.sh
          
          # Check SSH config file permissions inside container
          echo "/etc/ssh/sshd_config.d/sftp_jail.conf"
          docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%a' /etc/ssh/sshd_config.d/sftp_jail.conf" | grep -q '400' || (docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%a' /etc/ssh/sshd_config.d/sftp_jail.conf" && exit 1)
          echo "/etc/ssh/ssh_host_ed25519_key"
          docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%a' /etc/ssh/ssh_host_ed25519_key" | grep -q '400' || (docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%a' /etc/ssh/ssh_host_ed25519_key" && exit 1)

          # Check config ownership
          echo "/etc/ssh/sshd_config.d/sftp_jail.conf ownership"
          docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%U:%G' /etc/ssh/sshd_config.d/sftp_jail.conf" | grep -q 'root:root' || (docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%U:%G' /etc/ssh/sshd_config.d/sftp_jail.conf" && exit 1)
          echo "/etc/ssh/ssh_host_ed25519_key ownership"
          docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%U:%G' /etc/ssh/ssh_host_ed25519_key" | grep -q 'root:root' || (docker exec "$SFTP_TEST_CONTAINER_NAME" sh -c "stat -c '%U:%G' /etc/ssh/ssh_host_ed25519_key" && exit 1)


      - name: Test SFTP file transfer
        run: |
          source /tmp/test_helper.sh
          
          # Test SFTP connection and file transfer
          echo "test content" > /tmp/test_file.txt
          sftp -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            backtail@127.0.0.1 <<EOF
          put /tmp/test_file.txt test_file.txt
          ls
          quit
          EOF
          
          # Verify file was transferred (check in the mounted backup directory)
          test -f "$SFTP_TEST_BACKUP_DIR/test_file.txt" || exit 1

      - name: Test healthcheck functionality
        run: |
          source /tmp/test_helper.sh
          
          # Run healthcheck inside container
          docker exec "$SFTP_TEST_CONTAINER_NAME" /healthcheck.sh
          HEALTHCHECK_EXIT=$?
          
          if [ $HEALTHCHECK_EXIT -eq 0 ]; then
            echo "Healthcheck passed successfully"
          else
            echo "Healthcheck failed"
            docker logs "$SFTP_TEST_CONTAINER_NAME"
            exit 1
          fi
          
          # Also test Docker health status
          sleep 5  # Allow healthcheck to run
          HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' "$SFTP_TEST_CONTAINER_NAME")
          echo "Docker health status: $HEALTH_STATUS"
          docker inspect --format='{{json .State.Health}}' "$SFTP_TEST_CONTAINER_NAME"

      - name: "[Security] Test password authentication rejection"
        run: |
          source /tmp/test_helper.sh
          
          # Test password authentication should fail
          sshpass -p "testpassword" ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            -o PreferredAuthentications=password \
            backtail@127.0.0.1 "echo test" 2>&1 && exit 1 || exit 0

      - name: "[Security] Test keyboard-interactive authentication rejection"
        run: |
          source /tmp/test_helper.sh
          
          # Test keyboard-interactive authentication should fail
          ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            -o PreferredAuthentications=keyboard-interactive \
            backtail@127.0.0.1 "echo test" 2>&1 && exit 1 || exit 0

      - name: "[Security] Test unsupported key type rejection (RSA)"
        run: |
          source /tmp/test_helper.sh
          
          # First teardown the auto-setup, then setup with RSA key
          teardown_sftp_test
          setup_sftp_test "rsa"
          
          # Test RSA key authentication should fail (using the generated RSA key)
          ssh -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            backtail@127.0.0.1 "echo test" 2>&1 && exit 1 || exit 0

      - name: "[Security] Test invalid host key algorithm"
        run: |
          source /tmp/test_helper.sh
          
          # Test connection with RSA host key algorithm (should fail)
          if sftp -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            -o HostKeyAlgorithms=rsa-sha2-256 \
            backtail@127.0.0.1 <<EOF
          ls
          quit
          EOF
          then
            exit 1
          fi


      - name: "[Security] Test valid host key algorithm"
        run: |
          source /tmp/test_helper.sh
          
          # Test connection with only ED25519 host key algorithm (should succeed)
          if ! sftp -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            backtail@127.0.0.1 <<EOF
          ls
          quit
          EOF
          then
            exit 1
          fi

      - name: "[Security] Test port forwarding rejection"
        run: |
          source /tmp/test_helper.sh
          
          echo "Test TCP forwarding should fail"
          if timeout 5 ssh -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            -o ConnectTimeout=5 \
            -L 8080:localhost:80 \
            -N backtail@127.0.0.1 2>&1; then
            echo "ERROR: TCP forwarding succeeded when it should have failed"
            exit 1
          fi
          
          echo "Test X11 forwarding should fail"
          if timeout 5 ssh -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            -o ConnectTimeout=5 \
            -X \
            -N backtail@127.0.0.1 2>&1; then
            echo "ERROR: X11 forwarding succeeded when it should have failed"
            exit 1
          fi
          
          echo "Test agent forwarding should fail"
          if timeout 5 ssh -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            -o ConnectTimeout=5 \
            -A \
            -N backtail@127.0.0.1 2>&1; then
            echo "ERROR: Agent forwarding succeeded when it should have failed"
            exit 1
          fi

      - name: "[Security] Test chroot escape attempts"
        run: |
          source /tmp/test_helper.sh
          
          # Test directory traversal attempts via SFTP
          echo "test content" > /tmp/test_file.txt
          
          # Try to navigate to parent directory - should stay in chroot
          # The command should succeed but user should remain contained
          OUTPUT=$(sftp -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            backtail@127.0.0.1 <<EOF
          cd ../../
          ls
          quit
          EOF
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "backtail"; then
            echo "OK: User remained in chroot after cd ../../"
          else
            echo "ERROR: User escaped chroot or navigation failed"
            exit 1
          fi
          
          # Try to access absolute path outside chroot (should fail)
          OUTPUT=$(sftp -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            backtail@127.0.0.1 <<EOF
          ls /etc
          quit
          EOF
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Can't ls"; then
            echo "OK: Absolute path access outside chroot was blocked"
          else
            echo "ERROR: Absolute path access outside chroot succeeded"
            exit 1
          fi
          
          # Try to access system files via relative path (should fail)
          OUTPUT=$(sftp -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            backtail@127.0.0.1 <<EOF
          ls ../../../etc
          quit
          EOF
          )
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Can't ls"; then
            echo "OK: System file access via relative path was blocked"
          else
            echo "ERROR: System file access via relative path succeeded"
            exit 1
          fi

      - name: "[Security] Test ForceCommand enforcement"
        run: |
          source /tmp/test_helper.sh
          
          # Test arbitrary command execution should fail
          ssh -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            backtail@127.0.0.1 "whoami" 2>&1 && exit 1
          
          # Test shell access should fail
          ssh -i "$SFTP_TEST_KEY_PATH" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="$SFTP_TEST_PORT" \
            backtail@127.0.0.1 "/bin/sh" 2>&1 && exit 1

  build_and_publish_to_ghcr:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wazzanoski/backtail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Lint Shell Scripts
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: "-x" # Fix SC1091 errors

      # Lint Dockerfile
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3007,DL3018 # Pin versions

      # Lint GitHub Actions workflows
      - name: Run actionlint
        uses: raven-actions/actionlint@v2.2.0

      # Lint SSHD Configuration
      - name: Test SSHD Syntax
        run: |
          sudo sshd -t -f ./sftp_jail.conf

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t backtail:test .
      
      - name: Test valid PUID/PGID/UMASK combinations
        run: |
          # Test system user range (PUID=99, PGID=100)
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=022 backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=002 backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=000 backtail:test || exit 1
          
          # Test regular user range (PUID>=1000, PGID>=1000)
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 backtail:test || exit 1
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=002 backtail:test || exit 1
          docker run --rm -e PUID=1001 -e PGID=1001 -e UMASK=000 backtail:test || exit 1
      
      - name: Test invalid PUID (should fail)
        run: |
          ! docker run --rm -e PUID=999 backtail:test
      
      - name: Test invalid PGID (should fail)
        run: |
          ! docker run --rm PGID=999 backtail:test
      
      - name: Test invalid UMASK (should fail)
        run: |
          ! docker run --rm UMASK=abc backtail:test
      
      - name: Test SSH host key generation
        run: |
          mkdir -p /tmp/test-config
          docker run --rm -v /tmp/test-config:/config \
            -e PUID=99 -e PGID=100 -e UMASK=022 \
            backtail:test || true
          test -f /tmp/test-config/ssh_host_ed25519_key || exit 1
          rm -rf /tmp/test-config
      
      - name: Test banner file creation
        run: |
          mkdir -p /tmp/test-config
          docker run --rm -v /tmp/test-config:/config \
            -e PUID=99 -e PGID=100 -e UMASK=022 \
            backtail:test || true
          test -f /tmp/test-config/banner.txt || exit 1
          rm -rf /tmp/test-config
      
      - name: Test user permissions
        run: |
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 \
            backtail:test sh -c "id -u | grep -q 1000" || exit 1
      
      - name: Test group permissions
        run: |
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 \
            backtail:test sh -c "id -g | grep -q 1000" || exit 1
      
      - name: Test UMASK application
        run: |
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=022 \
            backtail:test sh -c "umask | grep -q 022" || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=002 \
            backtail:test sh -c "umask | grep -q 002" || exit 1

  build_and_publish_to_ghcr:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wazzanoski/backtail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

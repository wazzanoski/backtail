name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Lint Shell Scripts
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: "-x" # Fix SC1091 errors

      # Lint Dockerfile
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3007,DL3018 # Use latest versions, don't pin specific versions

      # Lint GitHub Actions workflows
      - name: Run actionlint
        uses: raven-actions/actionlint@v2.2.0

      # Lint SSHD Configuration
      - name: Test SSHD Syntax
        run: |
          # Validate config.env exists before sourcing
          if [ ! -f "./config.env" ]; then
            echo "Error: config.env not found"
            exit 1
          fi
          # Source shared configuration for consistent config file names
          source ./config.env
          # 1. Create the missing privilege directory that OpenSSH expects
          sudo mkdir -p /run/sshd
          # 2. Safely run your configuration validation
          sudo sshd -t -f "./${SSHD_CONFIG_FILE}"

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate config.env exists
        run: |
          if [ ! -f "./config.env" ]; then
            echo "Error: config.env not found"
            exit 1
          fi
          echo "config.env found and will be used for configuration"

      - name: Build Docker image
        run: |
          # Source shared configuration
          source ./config.env
          # Build with configuration variables as build args
          docker build \
            --build-arg BANNER_FILE="${BANNER_FILE}" \
            --build-arg HOST_KEY_FILE="${HOST_KEY_FILE}" \
            --build-arg SSHD_CONFIG_FILE="${SSHD_CONFIG_FILE}" \
            -t backtail:test .

      - name: Test dry-run mode
        run: |
          docker run --rm -e DRY_RUN=true backtail:test || exit 1

      - name: Test invalid PUID=abc (should fail)
        run: |
          ! docker run --rm -e PUID=abc -e DRY_RUN=true backtail:test || exit 1

      - name: Test invalid PUID=0 - "root" (should fail)
        run: |
          ! docker run --rm -e PUID=0 -e DRY_RUN=true backtail:test || exit 1

      - name: Test invalid PUID=999 - in system user range (should fail)
        run: |
          ! docker run --rm -e PUID=999 -e DRY_RUN=true backtail:test || exit 1

      - name: Test invalid PGID=abc (should fail)
        run: |
          ! docker run --rm -e PGID=abc -e DRY_RUN=true backtail:test || exit 1

      - name: Test invalid PGID=0 - "root" (should fail)
        run: |
          ! docker run --rm -e PGID=0 -e DRY_RUN=true backtail:test || exit 1

      - name: Test invalid PGID=999 - in system user range (should fail)
        run: |
          ! docker run --rm -e PGID=999 -e DRY_RUN=true backtail:test || exit 1

      - name: Test invalid UMASK=abc (should fail)
        run: |
          ! docker run --rm -e UMASK=abc -e DRY_RUN=true backtail:test || exit 1
      
      - name: Test invalid UMASK=888 (should fail)
        run: |
          ! docker run --rm -e UMASK=888 -e DRY_RUN=true backtail:test || exit 1

      - name: Test valid PUID/PGID/UMASK combinations
        run: |
          # Test system user range (PUID=99, PGID=100)
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=022 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=002 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=000 -e DRY_RUN=true backtail:test || exit 1
          
          # Test regular user range (PUID>=1000, PGID>=1000)
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=002 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=000 -e DRY_RUN=true backtail:test || exit 1

      - name: Test SSH host key generation
        run: |
          . ./test_helper.sh
          test -f "${SFTP_TEST_CONFIG_DIR}/${HOST_KEY_FILE}" || exit 1

      - name: Test banner file creation
        run: |
          . ./test_helper.sh
          test -f "${SFTP_TEST_CONFIG_DIR}/${BANNER_FILE}" || exit 1
      
      - name: Test user permissions
        run: |
          docker run --rm -e PUID=1000 -e DRY_RUN=true backtail:test \
            sh -c "id -u | grep -q 1000" || exit 1
      
      - name: Test group permissions
        run: |
          docker run --rm -e PUID=1000 -e DRY_RUN=true backtail:test \
            sh -c "id -g | grep -q 1000" || exit 1
      
      - name: Test UMASK application
        run: |
          docker run --rm -e UMASK=022 -e DRY_RUN=true backtail:test \
            sh -c "umask | grep -q 022" || exit 1
          docker run --rm -e UMASK=002 -e DRY_RUN=true backtail:test \
            sh -c "umask | grep -q 002" || exit 1

      - name: Test SSH config permissions
        run: |
          . ./test_helper.sh

          # Check SSH config file permissions inside container
          echo "/etc/ssh/sshd_config.d/${SSHD_CONFIG_FILE}"
          docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%a' /etc/ssh/sshd_config.d/${SSHD_CONFIG_FILE}" | grep -q '400' || (docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%a' /etc/ssh/sshd_config.d/${SSHD_CONFIG_FILE}" && exit 1)
          echo "/etc/ssh/${HOST_KEY_FILE}"
          docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%a' /etc/ssh/${HOST_KEY_FILE}" | grep -q '400' || (docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%a' /etc/ssh/${HOST_KEY_FILE}" && exit 1)

          # Check config ownership
          echo "/etc/ssh/sshd_config.d/${SSHD_CONFIG_FILE} ownership"
          docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%U:%G' /etc/ssh/sshd_config.d/${SSHD_CONFIG_FILE}" | grep -q 'root:root' || (docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%U:%G' /etc/ssh/sshd_config.d/${SSHD_CONFIG_FILE}" && exit 1)
          echo "/etc/ssh/${HOST_KEY_FILE} ownership"
          docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%U:%G' /etc/ssh/${HOST_KEY_FILE}" | grep -q 'root:root' || (docker exec "${SFTP_TEST_CONTAINER_NAME}" sh -c "stat -c '%U:%G' /etc/ssh/${HOST_KEY_FILE}" && exit 1)

      - name: Test SFTP file transfer
        run: |
          . ./test_helper.sh

          # Test SFTP connection and file transfer
          echo "test content" > /tmp/test_file.txt
          sftp -i "${SFTP_TEST_KEY_PATH}" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 <<EOF
          put /tmp/test_file.txt test_file.txt
          ls
          quit
          EOF

          # Verify file was transferred (check in the mounted backup directory)
          test -f "${SFTP_TEST_BACKUP_DIR}/test_file.txt" || exit 1

      - name: Test healthcheck functionality
        run: |
          . ./test_helper.sh

          # Run healthcheck inside container
          capture docker exec "${SFTP_TEST_CONTAINER_NAME}" /healthcheck.sh

          if [ "${CAPTURE_CODE}" -ne 0 ]; then
            echo "Healthcheck failed"
            docker logs "${SFTP_TEST_CONTAINER_NAME}"
            exit 1
          fi

          echo "Healthcheck passed successfully"

          # Also test Docker health status
          sleep 5  # Allow healthcheck to run
          HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' "${SFTP_TEST_CONTAINER_NAME}")
          echo "Docker health status: ${HEALTH_STATUS}"
          docker inspect --format='{{json .State.Health}}' "${SFTP_TEST_CONTAINER_NAME}"

      - name: "[Security] Test port forwarding rejection (AllowAgentForwarding no)"
        run: |
          . ./test_helper.sh

          # shellcheck disable=SC2016
          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -A \
            backtail@127.0.0.1 \
            'echo SSH_AUTH_SOCK=${SSH_AUTH_SOCK}; [ -n "${SSH_AUTH_SOCK}" ]'

          assert_failure

      - name: "[Security] Test stream local forwarding rejection (AllowStreamLocalForwarding no)"
        run: |
          . ./test_helper.sh

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -o ExitOnForwardFailure=yes \
            -L /tmp/client.sock:/tmp/server.sock \
            backtail@127.0.0.1 \
            true

          assert_failure

      - name: "[Security] Test port forwarding rejection (AllowTcpForwarding no)"
        run: |
          . ./test_helper.sh

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -o ConnectTimeout=5 \
            -o ExitOnForwardFailure=yes \
            -L 8080:localhost:80 \
            -N \
            backtail@127.0.0.1

          assert_failure

      - name: "[Security] Test port forwarding rejection (X11Forwarding no)"
        run: |
          . ./test_helper.sh

          # shellcheck disable=SC2016
          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -X \
            backtail@127.0.0.1 \
            'echo "DISPLAY=${DISPLAY}"; test -n "${DISPLAY}"'

          assert_failure

      - name: "[Security] Test password authentication rejection (AuthenticationMethods publickey)"
        run: |
          . ./test_helper.sh

          capture sshpass -p "testpassword" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -o PubkeyAuthentication=no \
            -o BatchMode=yes \
            -o PreferredAuthentications=password \
            backtail@127.0.0.1 \
            'true'

          assert_failure

      - name: "[Security] Test keyboard-interactive authentication rejection (AuthenticationMethods publickey)"
        run: |
          . ./test_helper.sh

          capture ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -o PreferredAuthentications=keyboard-interactive \
            backtail@127.0.0.1\
            'true'

          assert_failure

      - name: "[Security] Test RSA key type rejection (PubkeyAcceptedAlgorithms ssh-ed25519)"
        run: |
          . ./test_helper.sh

          # First teardown the auto-setup, then setup with RSA key
          teardown_sftp_test
          setup_sftp_test "rsa"

          # Test RSA key authentication should fail (using the generated RSA key)
          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 \
            'true'

          assert_failure

      - name: "[Security] Test ForceCommand enforcement (PermitTTY no)"
        run: |
          . ./test_helper.sh

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -o RequestTTY=force \
            backtail@127.0.0.1

          assert_failure          

      - name: "[Security] Test ForceCommand enforcement (ForceCommand internal-sftp)"
        run: |
          . ./test_helper.sh

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 \
            'true'

          assert_failure

      - name: "[Security] Test invalid host key algorithm (HostKeyAlgorithms ssh-ed25519)"
        run: |
          . ./test_helper.sh

          capture sftp -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -o HostKeyAlgorithms=rsa-sha2-256 \
            backtail@127.0.0.1 \
            'true'

          assert_failure

      - name: "[Security] Test valid host key algorithm (HostKeyAlgorithms ssh-ed25519)"
        run: |
          . ./test_helper.sh

          capture sftp -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            -o HostKeyAlgorithms=ssh-ed25519 \
            backtail@127.0.0.1 \
            'true'

          assert_success

      - name: "[Security] Test chroot escape attempts (ChrootDirectory)"
        run: |
          . ./test_helper.sh

          # Test directory traversal attempts via SFTP
          echo "test content" > /tmp/test_file.txt

          # Try to navigate to parent directory - should stay in chroot
          # The command should succeed but user should remain contained
          capture sftp -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 <<EOF
          cd ../../
          pwd
          quit
          EOF

          assert_stdout "/"

          # Try to access absolute path outside chroot (should fail)
          capture sftp -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 <<EOF
          ls /etc
          quit
          EOF

          assert_stderr 'not found'

          # Try to access system files via relative path (should fail)
          capture sftp -i "${SFTP_TEST_KEY_PATH}" -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 <<EOF
          ls ../../../etc
          quit
          EOF

          assert_stderr 'not found'

      - name: "[Security] Test root login rejection (PermitRootLogin no)"
        run: |
          . ./test_helper.sh

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            root@127.0.0.1 \
            true

          assert_failure

      - name: "[Security] Test unauthorized user rejection (AllowUsers backtail)"
        run: |
          . ./test_helper.sh

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            nobody@127.0.0.1 \
            true

          assert_failure

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            guest@127.0.0.1 \
            true

          assert_failure

      - name: "[Security] Test force command landing directory (ForceCommand internal-sftp -d /backtail)"
        run: |
          . ./test_helper.sh

          capture sftp -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 <<EOF
          pwd
          quit
          EOF

          assert_stdout "/backtail"

      - name: "[Security] Test banner display (Banner /config/banner.txt)"
        run: |
          . ./test_helper.sh

          BANNER_DISPLAY="banner test"

          echo "${BANNER_DISPLAY}" > "${SFTP_TEST_CONFIG_DIR}/${BANNER_FILE}"

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1\
            true

          assert_stdout "${BANNER_DISPLAY}"

      - name: "[Security] Test unsupported key type rejection (ECDSA) (PubkeyAcceptedAlgorithms ssh-ed25519)"
        run: |
          . ./test_helper.sh
          teardown_sftp_test
          setup_sftp_test "ecdsa"

          capture ssh -i "${SFTP_TEST_KEY_PATH}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port="${SFTP_TEST_PORT}" \
            backtail@127.0.0.1 "echo test"

          assert_failure

  build_and_publish_to_ghcr:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wazzanoski/backtail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Load configuration from config.env
        id: config
        run: |
          {
            echo "BANNER_FILE=$(grep '^BANNER_FILE=' config.env | cut -d'=' -f2 | tr -d '"')"
            echo "HOST_KEY_FILE=$(grep '^HOST_KEY_FILE=' config.env | cut -d'=' -f2 | tr -d '"')"
            echo "SSHD_CONFIG_FILE=$(grep '^SSHD_CONFIG_FILE=' config.env | cut -d'=' -f2 | tr -d '"')"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BANNER_FILE=${{ steps.config.outputs.BANNER_FILE }}
            HOST_KEY_FILE=${{ steps.config.outputs.HOST_KEY_FILE }}
            SSHD_CONFIG_FILE=${{ steps.config.outputs.SSHD_CONFIG_FILE }}

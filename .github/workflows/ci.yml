name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Lint Shell Scripts
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: "-x" # Fix SC1091 errors

      # Lint Dockerfile
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3007,DL3018 # Use latest versions, don't pin specific versions

      # Lint GitHub Actions workflows
      - name: Run actionlint
        uses: raven-actions/actionlint@v2.2.0

      # Lint SSHD Configuration
      - name: Test SSHD Syntax
        run: |
          # 1. Create the missing privilege directory that OpenSSH expects
          sudo mkdir -p /run/sshd
          # 2. Safely run your configuration validation
          sudo sshd -t -f ./sftp_jail.conf

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t backtail:test .
      
      - name: Test dry-run mode
        run: |
          docker run --rm -e DRY_RUN=true \
            backtail:test || exit 1

      - name: Test invalid PUID=abc (should fail)
        run: |
          ! docker run --rm -e PUID=abc -e DRY_RUN=true backtail:test

      - name: Test invalid PUID=0 - "root" (should fail)
        run: |
          ! docker run --rm -e PUID=0 -e DRY_RUN=true backtail:test

      - name: Test invalid PUID=999 - in system user range (should fail)
        run: |
          ! docker run --rm -e PUID=999 -e DRY_RUN=true backtail:test

      - name: Test invalid PGID=abc (should fail)
        run: |
          ! docker run --rm -e PGID=abc -e DRY_RUN=true backtail:test

      - name: Test invalid PGID=0 - "root" (should fail)
        run: |
          ! docker run --rm -e PGID=0 -e DRY_RUN=true backtail:test

      - name: Test invalid PGID=999 - in system user range (should fail)
        run: |
          ! docker run --rm -e PGID=999 -e DRY_RUN=true backtail:test

      - name: Test invalid UMASK=abc (should fail)
        run: |
          ! docker run --rm -e UMASK=abc -e DRY_RUN=true backtail:test
      
      - name: Test invalid UMASK=888 (should fail)
        run: |
          ! docker run --rm -e UMASK=888 -e DRY_RUN=true backtail:test

      - name: Test valid PUID/PGID/UMASK combinations
        run: |
          # Test system user range (PUID=99, PGID=100)
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=022 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=002 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=99 -e PGID=100 -e UMASK=000 -e DRY_RUN=true backtail:test || exit 1
          # Test regular user range (PUID>=1000, PGID>=1000)
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=002 -e DRY_RUN=true backtail:test || exit 1
          docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=000 -e DRY_RUN=true backtail:test || exit 1

      - name: Test SSH host key generation
        run: |
          whoami
          id -u
          id -g
          mkdir -p /tmp/test-config
          ls -la /tmp/test-config/
          docker run -d --name backtail-test-keys \
            -v /tmp/test-config:/config \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          # Wait for SSHD to start and generate keys
          sleep 3
          ls -la /tmp/test-config/
          docker logs backtail-test-keys
          docker stop backtail-test-keys
          docker rm backtail-test-keys
          ls -la /tmp/test-config/
          test -f /tmp/test-config/ssh_host_ed25519_key || exit 1

          ls -la /tmp/test-config/
          rm -rf /tmp/test-config
      
      - name: Test banner file creation
        run: |
          mkdir -p /tmp/test-config
          docker run -d --name backtail-test-banner \
            -v /tmp/test-config:/config \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          # Wait for SSHD to start and create banner
          sleep 3
          docker stop backtail-test-banner
          docker rm backtail-test-banner
          test -f /tmp/test-config/banner.txt || exit 1
          rm -rf /tmp/test-config
      
      - name: Test user permissions
        run: |
          docker run --rm -e PUID=1000 -e DRY_RUN=true \
            backtail:test sh -c "id -u | grep -q 1000" || exit 1
      
      - name: Test group permissions
        run: |
          docker run --rm -e PUID=1000 -e DRY_RUN=true \
            backtail:test sh -c "id -g | grep -q 1000" || exit 1
      
      - name: Test UMASK application
        run: |
          docker run --rm -e UMASK=022 -e DRY_RUN=true \
            backtail:test sh -c "umask | grep -q 022" || exit 1
          docker run --rm -e UMASK=002 -e DRY_RUN=true \
            backtail:test sh -c "umask | grep -q 002" || exit 1

      - name: Test SFTP file transfer
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          
          # Setup authorized_keys
          cp /tmp/test_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container in background (Tailscale disabled for testing)
          docker run -d --name backtail-test \
            -p 2222:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test SFTP connection and file transfer
          echo "test content" > /tmp/test_file.txt
          sftp -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2222 \
            backtail@127.0.0.1 <<EOF
          put /tmp/test_file.txt test_file.txt
          ls
          quit
          EOF
          
          # Verify file was transferred
          docker exec backtail-test test -f /data/backtail/test_file.txt || exit 1
          
          # Cleanup
          docker stop backtail-test
          docker rm backtail-test
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_key /tmp/test_key.pub /tmp/test_file.txt

      - name: Test healthcheck functionality
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup
          
          # Start container in background (Tailscale disabled for testing)
          docker run -d --name backtail-test-health \
            -p 2223:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for container to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-health pgrep sshd >/dev/null; then
              echo "Container is ready"
              break
            fi
            echo "Waiting for container... ($i/30)"
            sleep 2
          done
          
          # Run healthcheck inside container
          docker exec backtail-test-health /healthcheck.sh
          HEALTHCHECK_EXIT=$?
          
          if [ $HEALTHCHECK_EXIT -eq 0 ]; then
            echo "Healthcheck passed successfully"
          else
            echo "Healthcheck failed"
            docker logs backtail-test-health
            exit 1
          fi
          
          # Also test Docker health status
          sleep 5  # Allow healthcheck to run
          HEALTH_STATUS=$(docker inspect --format='{{.State.Health.Status}}' backtail-test-health)
          echo "Docker health status: $HEALTH_STATUS"
          docker inspect --format='{{json .State.Health}}' backtail-test-health
          
          # Cleanup
          docker stop backtail-test-health
          docker rm backtail-test-health
          rm -rf /tmp/test-backup /tmp/test-config

      - name: Test password authentication rejection
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          cp /tmp/test_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container
          docker run -d --name backtail-test-auth \
            -p 2224:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-auth pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test password authentication should fail
          sshpass -p "testpassword" ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2224 \
            -o PreferredAuthentications=password \
            backtail@127.0.0.1 "echo test" 2>&1 | grep -q "Permission denied" || exit 1
          
          # Cleanup
          docker stop backtail-test-auth
          docker rm backtail-test-auth
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_key /tmp/test_key.pub

      - name: Test keyboard-interactive authentication rejection
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          cp /tmp/test_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container
          docker run -d --name backtail-test-kbi \
            -p 2225:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-kbi pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test keyboard-interactive authentication should fail
          ssh -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2225 \
            -o PreferredAuthentications=keyboard-interactive \
            backtail@127.0.0.1 "echo test" 2>&1 && exit 1
          
          # Cleanup
          docker stop backtail-test-kbi
          docker rm backtail-test-kbi
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_key /tmp/test_key.pub

      - name: Test unsupported key type rejection (RSA)
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate RSA key pair (should be rejected)
          ssh-keygen -t rsa -f /tmp/test_rsa_key -N "" -q
          cp /tmp/test_rsa_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container
          docker run -d --name backtail-test-rsa \
            -p 2226:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-rsa pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test RSA key authentication should fail
          ssh -i /tmp/test_rsa_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2226 \
            backtail@127.0.0.1 "echo test" 2>&1 && exit 1
          
          # Cleanup
          docker stop backtail-test-rsa
          docker rm backtail-test-rsa
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_rsa_key /tmp/test_rsa_key.pub

      - name: Test SSH config permissions
        run: |
          # Create test environment
          mkdir -p /tmp/test-config
          
          # Start container
          docker run -d --name backtail-test-perms \
            -v /tmp/test-config:/config \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-perms pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Check SSH config file permissions inside container
          docker exec backtail-test-perms sh -c "stat -c '%a' /etc/ssh/sshd_config.d/sftp_jail.conf" | grep -q '400' || exit 1
          docker exec backtail-test-perms sh -c "stat -c '%a' /etc/ssh/ssh_host_ed25519_key" | grep -q '400' || exit 1
          
          # Check config ownership
          docker exec backtail-test-perms sh -c "stat -c '%U:%G' /etc/ssh/sshd_config.d/sftp_jail.conf" | grep -q 'root:root' || exit 1
          docker exec backtail-test-perms sh -c "stat -c '%U:%G' /etc/ssh/ssh_host_ed25519_key" | grep -q 'root:root' || exit 1
          
          # Cleanup
          docker stop backtail-test-perms
          docker rm backtail-test-perms
          rm -rf /tmp/test-config

      - name: Test host key algorithm enforcement
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          cp /tmp/test_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container
          docker run -d --name backtail-test-hostkey \
            -p 2227:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-hostkey pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test connection with only ED25519 host key algorithm (should succeed)
          ssh -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2227 \
            -o HostKeyAlgorithms=ssh-ed25519 \
            backtail@127.0.0.1 "echo test" | grep -q "test"
          
          # Test connection with RSA host key algorithm (should fail)
          ssh -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2227 \
            -o HostKeyAlgorithms=rsa-sha2-256 \
            backtail@127.0.0.1 "echo test" 2>&1 && exit 1
          
          # Cleanup
          docker stop backtail-test-hostkey
          docker rm backtail-test-hostkey
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_key /tmp/test_key.pub

      - name: Test port forwarding rejection
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          cp /tmp/test_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container
          docker run -d --name backtail-test-forwarding \
            -p 2228:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-forwarding pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test TCP forwarding should fail
          ssh -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2228 \
            -L 8080:localhost:80 \
            -N backtail@127.0.0.1 2>&1 && exit 1
          
          # Test X11 forwarding should fail
          ssh -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2228 \
            -X \
            -N backtail@127.0.0.1 2>&1 && exit 1
          
          # Test agent forwarding should fail
          ssh -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2228 \
            -A \
            -N backtail@127.0.0.1 2>&1 && exit 1
          
          # Cleanup
          docker stop backtail-test-forwarding
          docker rm backtail-test-forwarding
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_key /tmp/test_key.pub

      - name: Test chroot escape attempts
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          cp /tmp/test_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container
          docker run -d --name backtail-test-chroot \
            -p 2229:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-chroot pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test directory traversal attempts via SFTP
          echo "test content" > /tmp/test_file.txt
          
          # Try to navigate to parent directory (should fail)
          if sftp -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2229 \
            backtail@127.0.0.1 <<EOF
          cd ../../
          ls
          quit
          EOF
          then
            exit 1
          fi
          
          # Try to access absolute path (should fail)
          if sftp -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2229 \
            backtail@127.0.0.1 <<EOF
          ls /etc
          quit
          EOF
          then
            exit 1
          fi
          
          # Cleanup
          docker stop backtail-test-chroot
          docker rm backtail-test-chroot
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_key /tmp/test_key.pub /tmp/test_file.txt

      - name: Test ForceCommand enforcement
        run: |
          # Create test environment
          mkdir -p /tmp/test-config /tmp/test-backup /tmp/test-backup/.ssh
          
          # Generate SSH key pair for testing
          ssh-keygen -t ed25519 -f /tmp/test_key -N "" -q
          cp /tmp/test_key.pub /tmp/test-backup/.ssh/authorized_keys
          
          # Start container
          docker run -d --name backtail-test-forcecmd \
            -p 2230:22 \
            -v /tmp/test-config:/config \
            -v /tmp/test-backup:/data/backtail \
            -e PUID="$(id -u)" -e PGID="$(id -g)" \
            -e TAILSCALE_ENABLED=false \
            backtail:test
          
          # Wait for SSH to be ready
          for i in $(seq 1 30); do
            if docker exec backtail-test-forcecmd pgrep sshd >/dev/null; then
              echo "SSH is ready"
              break
            fi
            echo "Waiting for SSH... ($i/30)"
            sleep 2
          done
          
          # Test arbitrary command execution should fail
          ssh -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2230 \
            backtail@127.0.0.1 "whoami" 2>&1 && exit 1
          
          # Test shell access should fail
          ssh -i /tmp/test_key -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o Port=2230 \
            backtail@127.0.0.1 "/bin/sh" 2>&1 && exit 1
          
          # Cleanup
          docker stop backtail-test-forcecmd
          docker rm backtail-test-forcecmd
          rm -rf /tmp/test-backup /tmp/test-config /tmp/test_key /tmp/test_key.pub

  build_and_publish_to_ghcr:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/wazzanoski/backtail
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=semver,pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

name: Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck
    
    - name: Check shell script syntax
      run: |
        shellcheck entrypoint.sh
        shellcheck run_tailscale.sh
        shellcheck run_sftp.sh
        shellcheck logger.sh
    
    - name: Build Docker image
      run: docker build -t backtail:test .
    
    - name: Test valid PUID/PGID/UMASK combinations
      run: |
        # Test system user range (PUID=99, PGID=100)
        docker run --rm -e PUID=99 -e PGID=100 -e UMASK=022 backtail:test || exit 1
        docker run --rm -e PUID=99 -e PGID=100 -e UMASK=002 backtail:test || exit 1
        docker run --rm -e PUID=99 -e PGID=100 -e UMASK=000 backtail:test || exit 1
        
        # Test regular user range (PUID>=1000, PGID>=1000)
        docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 backtail:test || exit 1
        docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=002 backtail:test || exit 1
        docker run --rm -e PUID=1001 -e PGID=1001 -e UMASK=000 backtail:test || exit 1
    
    - name: Test invalid PUID (should fail)
      run: |
        docker run --rm -e PUID=999 -e PGID=100 -e UMASK=022 backtail:test && exit 1 || true
    
    - name: Test invalid PGID (should fail)
      run: |
        docker run --rm -e PUID=99 -e PGID=999 -e UMASK=022 backtail:test && exit 1 || true
    
    - name: Test invalid UMASK (should fail)
      run: |
        docker run --rm -e PUID=99 -e PGID=100 -e UMASK=abc backtail:test && exit 1 || true
    
    - name: Test SSH host key generation
      run: |
        mkdir -p /tmp/test-config
        docker run --rm -v /tmp/test-config:/config \
          -e PUID=99 -e PGID=100 -e UMASK=022 \
          backtail:test || true
        test -f /tmp/test-config/ssh_host_ed25519_key || exit 1
        rm -rf /tmp/test-config
    
    - name: Test banner file creation
      run: |
        mkdir -p /tmp/test-config
        docker run --rm -v /tmp/test-config:/config \
          -e PUID=99 -e PGID=100 -e UMASK=022 \
          backtail:test || true
        test -f /tmp/test-config/banner.txt || exit 1
        rm -rf /tmp/test-config
    
    - name: Test user permissions
      run: |
        docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 \
          backtail:test sh -c "id -u | grep -q 1000" || exit 1
    
    - name: Test group permissions
      run: |
        docker run --rm -e PUID=1000 -e PGID=1000 -e UMASK=022 \
          backtail:test sh -c "id -g | grep -q 1000" || exit 1
    
    - name: Test UMASK application
      run: |
        docker run --rm -e PUID=99 -e PGID=100 -e UMASK=022 \
          backtail:test sh -c "umask | grep -q 022" || exit 1
        docker run --rm -e PUID=99 -e PGID=100 -e UMASK=002 \
          backtail:test sh -c "umask | grep -q 002" || exit 1
